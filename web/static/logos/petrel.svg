<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="200" height="240">
  <defs>
    <!-- Rounded square: warm copper/orange like the real logo -->
    <linearGradient id="pBg" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%"   stop-color="#E8A458"/>
      <stop offset="35%"  stop-color="#C96A1A"/>
      <stop offset="100%" stop-color="#7A2D06"/>
    </linearGradient>
    <!-- Inner warm highlight in top-left -->
    <radialGradient id="pShine" cx="30%" cy="28%" r="55%">
      <stop offset="0%"   stop-color="#F5D080" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#C96A1A" stop-opacity="0"/>
    </radialGradient>
    <!-- Star: gold gradient -->
    <radialGradient id="pStarGrad" cx="42%" cy="35%" r="60%">
      <stop offset="0%"   stop-color="#FFF0A0"/>
      <stop offset="30%"  stop-color="#FFD040"/>
      <stop offset="70%"  stop-color="#C87010"/>
      <stop offset="100%" stop-color="#7A3000"/>
    </radialGradient>
    <!-- Star 3-D dark face gradient -->
    <linearGradient id="pStarDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#8B3800"/>
      <stop offset="100%" stop-color="#5A1A00"/>
    </linearGradient>
    <filter id="pShadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="2" dy="5" stdDeviation="6" flood-color="#4A1200" flood-opacity="0.55"/>
    </filter>
    <filter id="pGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="pInner">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur"/>
      <feOffset dx="0" dy="2"/>
      <feComposite in2="SourceAlpha" operator="arithmetic" k2="-1" k3="1"/>
    </filter>
  </defs>

  <!-- Rounded-square background -->
  <rect x="20" y="8" width="160" height="160" rx="26" ry="26"
        fill="url(#pBg)" filter="url(#pShadow)"/>
  <!-- Top-left warm shine -->
  <rect x="20" y="8" width="160" height="160" rx="26" ry="26"
        fill="url(#pShine)"/>
  <!-- Subtle border -->
  <rect x="20" y="8" width="160" height="160" rx="26" ry="26"
        fill="none" stroke="#E8C070" stroke-width="1.5" opacity="0.45"/>

  <!-- ── 4-pointed star (center 100,88) rotated ~-30° to match logo angle ── -->
  <g transform="translate(100,88) rotate(-32)" filter="url(#pGlow)">
    <!-- Back shadow faces (give 3-D depth) -->
    <path d="M0,-68 L9,-9 L68,0 L9,9 L0,68 L-9,9 L-68,0 L-9,-9 Z"
          fill="url(#pStarDark)" opacity="0.35" transform="translate(3,5)"/>

    <!-- Main star body -->
    <path d="M0,-68 L9,-9 L68,0 L9,9 L0,68 L-9,9 L-68,0 L-9,-9 Z"
          fill="url(#pStarGrad)"/>

    <!-- Bright highlight on upper-left face (simulates 3-D light) -->
    <path d="M0,-68 L9,-9 L0,0 L-9,-9 Z" fill="#FFF4C0" opacity="0.45"/>
    <path d="M-68,0 L-9,-9 L0,0 L-9,9 Z"  fill="#FFC850" opacity="0.30"/>

    <!-- Dark shadow faces -->
    <path d="M68,0 L9,9 L0,0 L9,-9 Z"    fill="#7A3000" opacity="0.40"/>
    <path d="M0,68 L-9,9 L0,0 L9,9 Z"    fill="#5A1800" opacity="0.45"/>

    <!-- Center core dark -->
    <ellipse cx="0" cy="0" rx="9" ry="9" fill="#6B2800" opacity="0.70"/>
    <!-- Center glint -->
    <ellipse cx="-2" cy="-3" rx="4" ry="3" fill="white" opacity="0.50"/>
  </g>

  <!-- "Petrel" — matching the navy-blue bold font in the real logo -->
  <text x="100" y="197"
        font-family="'Arial Black', 'Arial Bold', Helvetica, sans-serif"
        font-size="34" font-weight="900" fill="#1B3564"
        text-anchor="middle" letter-spacing="-0.5">Petrel</text>

  <!-- "Schlumberger" — medium blue, thinner -->
  <text x="100" y="218"
        font-family="'Segoe UI', Arial, sans-serif"
        font-size="13.5" font-weight="600" fill="#2B5798"
        text-anchor="middle" letter-spacing="0.4">Schlumberger</text>
</svg>
